services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform_dev_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-platform}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform} -d ${POSTGRES_DB:-platform}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # 校园网部署时注释掉 ports，仅内部通信
    # ports:
    #   - "5432:5432"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform_dev_pwd}@db:5432/${POSTGRES_DB:-platform}
      AUTH_URL: http://localhost
      AUTH_SECRET: ${AUTH_SECRET}
      ACTIVE_AI_PROVIDER: ${ACTIVE_AI_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
    restart: unless-stopped
    # 不暴露端口到宿主机，通过 nginx 访问
    # 本地测试需要直连时取消注释:
    # ports:
    #   - "3000:3000"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
